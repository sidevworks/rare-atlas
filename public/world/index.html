<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a13">
<title>Rare Atlas — a guided research library</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a13;color:#deebf3}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
#atlas{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#atlas-fade{position:absolute;inset:0;background:#050a13;opacity:0;pointer-events:none;z-index:10}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:wait;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #b3e5f1;outline-offset:3px}
[hidden]{display:none!important}
#boot{position:absolute;inset:0;display:grid;place-items:center;z-index:90;background:#050a13}
.boot-content{max-width:490px;padding:28px;text-align:center}
.boot-mark{width:46px;height:46px;border:1px solid #9fcdd84d;border-radius:50%;margin:0 auto 24px;display:grid;place-items:center;color:#bce5f0;font-size:22px}
#boot h1{font:32px Georgia,serif;margin:0 0 14px}
#boot p{font-size:13px;color:#a5becd;line-height:1.7}
#boot small{color:#7793a5}
#rai-ui{position:absolute;inset:0;z-index:20;pointer-events:none;color:#dceaf2;font-size:12px;line-height:1.5;--line:#a4c8da30;--glass:#091623ed;--accent:#b9dce8}
#rai-ui *{box-sizing:border-box}
#rai-ui button{border:1px solid var(--line);color:#dce9f0;background:#1c2f3d99;border-radius:8px;padding:7px 10px;transition:background .15s,border-color .15s}
#rai-ui button:hover{background:#365366;border-color:#a7d9ec80}
#rai-ui button[aria-pressed=true]{background:#70b7cc2e;border-color:#8bbacc}
#rai-ui button.ra-primary{background:#b8dbe6;border-color:#b8dbe6;color:#112536}
#rai-ui input,#rai-ui select,#rai-ui textarea{background:#081622;border:1px solid var(--line);border-radius:8px;color:#e5eff4;padding:8px 10px;min-width:0}
#rai-ui a{color:#b7dfea;text-underline-offset:3px;overflow-wrap:anywhere}
.ra-head{position:absolute;inset:12px 14px auto;display:flex;align-items:center;gap:10px;pointer-events:auto;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(110deg,#0c1926f5,#0c1926dd);box-shadow:0 12px 40px #0003}
.ra-brand{display:flex;align-items:center;gap:9px;min-width:137px}
.ra-brand svg{width:26px;height:26px}
.ra-brand strong{font:19px Georgia,serif;display:block;white-space:nowrap}
.ra-kicker{font-size:8px;letter-spacing:1.65px;color:#91b2c4}
.ra-search{display:flex;flex:1;gap:5px;min-width:120px;margin-inline-start:auto}
.ra-search input{width:100%;min-width:80px}
.ra-search select{max-width:129px;font-size:11px}
.ra-head #ra-language{max-width:124px}
.ra-head>button{white-space:nowrap}
.ra-rail{position:absolute;inset:88px auto auto 14px;width:176px;max-height:calc(100% - 174px);overflow:auto;pointer-events:auto;border:1px solid var(--line);border-radius:13px;background:var(--glass);padding:12px;scrollbar-width:thin}
.ra-rail h2{font-size:9px;letter-spacing:1.7px;font-weight:500;color:#a0bac8;margin:0 0 10px}
.ra-collections{display:grid;gap:4px}
.ra-collections button{display:flex;justify-content:space-between;text-align:start;padding:6px 9px!important}
.ra-collections small{color:#7897a8}
.ra-rail .ra-primary{width:100%;margin-top:12px}
.ra-small{font-size:10px;color:#96b1c2}
.ra-rail p{margin:12px 0 0}
.ra-line{border-top:1px solid var(--line);padding-top:11px}
.ra-service{display:flex;gap:7px;align-items:center;margin-bottom:5px}
.ra-dot{height:6px;width:6px;background:#7e8e9a;border-radius:50%;flex:none}
.ra-dot.live{background:#9cddbf;box-shadow:0 0 9px #9cddbf44}
.ra-dot.error{background:#dab78d}
.ra-bar{position:absolute;inset:auto 14px 12px;pointer-events:auto;display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--glass);border:1px solid var(--line);border-radius:12px}
.ra-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ra-bar button{white-space:nowrap;padding:6px 9px!important}
.ra-status{flex:1;min-width:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#9db8c9;font-size:10px;text-align:center}
.ra-medical{font-size:10px;color:#dfcda9;white-space:nowrap;padding-inline:6px}
.ra-inspector{position:absolute;inset:88px 14px 80px auto;width:344px;pointer-events:auto;display:flex;flex-direction:column;background:#091623f7;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 50px #0005;overflow:hidden}
.ra-inspector-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:1.4px;color:#abc6d5}
.ra-inspector-head button{padding:2px 8px!important;font-size:18px}
.ra-inspector-body{padding:16px;overflow:auto;scrollbar-width:thin}
.ra-inspector h2{font:25px/1.2 Georgia,serif;margin:10px 0 14px;overflow-wrap:anywhere}
.ra-inspector h3{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:#9dbacb;margin:20px 0 7px}
.ra-inspector p{margin:8px 0;color:#c2d5e2;overflow-wrap:anywhere}
.ra-inspector ol,.ra-inspector ul{padding-inline-start:20px;color:#c3d7e1}
.ra-inspector li{margin:5px 0;overflow-wrap:anywhere}
.ra-badge{display:inline-block;font-size:9px;letter-spacing:.7px;border:1px solid #9bc5d644;border-radius:5px;padding:3px 6px;color:#aecfdd}
.ra-badge.lead{border-style:dashed;color:#dfc89b}
.ra-caution{border-inline-start:2px solid #c3ad81;background:#c3956b0d;padding:9px 11px;border-radius:0 6px 6px 0;color:#d9c8a9!important}
.ra-quote{border-inline-start:2px solid #91bdce;padding:9px 11px;background:#8ab5c20b;font-family:Georgia,serif}
.ra-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ra-record{display:block;width:100%;text-align:start;margin:7px 0}
.ra-record span,.ra-record small{display:block}
.ra-record small{color:#91adbd;font-size:10px;margin-top:3px}
.ra-source{padding:9px 0;border-bottom:1px solid var(--line)}
.ra-source strong{font-weight:550;font-size:12px}
.ra-source small{display:block;color:#91adbd;font-size:10px;margin:3px 0}
.ra-command{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));pointer-events:auto;background:#081624f8;border:1px solid #91c5d055;border-radius:13px;padding:12px 14px;box-shadow:0 15px 45px #0006}
.ra-command-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;letter-spacing:1.3px;color:#a8c2d0;margin-bottom:9px}
.ra-command form{display:flex;gap:6px}
.ra-command input{flex:1;width:0}
.ra-response{color:#b4cdda;font-size:11px;margin:8px 0 0;max-height:80px;overflow:auto}
#ra-caption{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);max-width:min(690px,82vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;padding:7px 14px;background:#05080fed;border:1px solid #a9d5e826;border-radius:20px;color:#e6f0f4;font:13px/1.5 Georgia,serif;pointer-events:none}
#ra-caption-label{font:9px system-ui;letter-spacing:1px;color:#96becf;margin-inline-end:8px}
.ra-tour{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));pointer-events:auto;background:linear-gradient(120deg,#102434f5,#081520f5);border:1px solid #91c5d055;border-radius:14px;padding:13px 16px;box-shadow:0 12px 40px #0004}
.ra-tour-top{display:flex;align-items:center;gap:8px}
.ra-tour-kicker{font-size:9px;letter-spacing:1.5px;color:#a0c6d8;flex:1}
.ra-tour-clock{font:11px ui-monospace,monospace;color:#b8d7e4}
#ra-tour-title{font:22px Georgia,serif;margin:5px 0 7px}
#ra-tour-copy{font-size:12px;line-height:1.65;color:#c1d6e4;margin:0}
.ra-progress{height:2px;background:#a2c4d51f;margin:12px 0 0}
#ra-progress-fill{height:100%;background:#a8d9e7;width:0}
.ra-tour button{padding:3px 7px!important;font-size:10px}
.ra-live-label{position:absolute;top:85px;left:50%;transform:translateX(-50%);color:#9eb8c8;font-size:9px;letter-spacing:1.8px;pointer-events:none;text-align:center}
.ra-mobile-move{display:none;position:absolute;left:18px;bottom:154px;pointer-events:auto;grid-template-columns:40px 40px 40px;gap:4px}
.ra-mobile-move button{width:40px;height:40px}
#rai-ui dialog{pointer-events:auto;color:#dbeaf3;background:#0b1c2b;border:1px solid #9bbdce55;border-radius:16px;width:min(460px,calc(100vw - 30px));max-height:85vh;padding:23px;box-shadow:0 25px 90px #0008}
#rai-ui dialog::backdrop{background:#020811a8}
#rai-ui dialog h2{font:27px Georgia,serif;margin:0 0 14px}
#rai-ui dialog p{font-size:12px;line-height:1.7;color:#b8cfdd}
#rai-ui dialog label{display:block;font-size:11px;color:#a9c5d4;margin:12px 0 5px}
#rai-ui dialog input,#rai-ui dialog select,#rai-ui dialog textarea{width:100%}
#rai-ui dialog textarea{min-height:86px;resize:vertical}
#ra-brief-target{width:100%;margin-top:8px}
.ra-cite{display:inline-block;padding:2px 5px!important;font-size:10px!important;margin-inline:3px}
#ra-mic[aria-pressed=true]{border-color:#9cdac6;background:#5e9c8e24}
#ra-audio-enable{color:#d7c499}
[dir=rtl] .ra-head,[dir=rtl] .ra-bar{direction:rtl}
[dir=rtl] .ra-rail{left:auto;right:14px}
[dir=rtl] .ra-inspector{left:14px;right:auto}
@media(pointer:coarse){.ra-mobile-move{display:grid}}
@media(max-width:1100px){.ra-status{display:none}.ra-bar{justify-content:space-between}.ra-head{gap:6px}.ra-search select{max-width:96px}.ra-kicker{display:none}.ra-inspector{width:310px}.ra-rail{width:155px}.ra-brand{min-width:125px}}
@media(max-width:780px){.ra-head{inset:8px 8px auto;flex-wrap:wrap}.ra-brand{flex:1}.ra-search{order:5;flex-basis:100%}.ra-head #ra-language{max-width:118px}.ra-rail{inset:116px auto auto 8px;width:132px;max-height:calc(100% - 260px);padding:9px}.ra-inspector{inset:116px 8px 100px auto;width:min(325px,calc(100% - 153px))}.ra-bar{inset:auto 8px 8px;padding:6px;flex-wrap:wrap}.ra-bar button{padding:5px 6px!important;font-size:10px}.ra-medical{margin-inline-start:auto}.ra-tour{bottom:110px;width:calc(100% - 28px);padding:11px 13px}.ra-command{bottom:110px}.ra-live-label{top:111px;left:auto;right:16px;transform:none;font-size:8px}.ra-rail .ra-small{font-size:9px}.ra-mobile-move{bottom:250px}.ra-tour-top{gap:5px}#ra-tour-title{font-size:20px}.ra-tour #ra-tour-copy{font-size:11px}.ra-rail .ra-primary{font-size:10px;padding:7px 4px!important}[dir=rtl] .ra-rail{right:8px}[dir=rtl] .ra-inspector{left:8px;right:auto}}
@media(max-height:550px){.ra-head{top:7px;padding:6px 10px}.ra-rail,.ra-inspector{top:73px}.ra-rail{max-height:calc(100% - 150px)}.ra-tour{bottom:72px;padding:9px 13px;max-width:460px}.ra-tour #ra-tour-copy{font-size:11px;line-height:1.4}.ra-tour #ra-tour-title{font-size:18px}.ra-bar{bottom:7px}.ra-inspector{bottom:67px}.ra-live-label{top:72px}}
</style>
</head>
<body>
<div id="atlas">
 <div id="boot" role="status"><div class="boot-content"><div class="boot-mark">✧</div><h1>Rare Atlas</h1><p id="boot-message">Opening your library and preparing the clerk’s tour.</p><small>The library is an interface. Named records must come from their sources.</small></div></div>
</div>
<audio id="ra-remote-audio" autoplay playsinline></audio>
<script type="text/plain" data-state>
window.installRareAtlasVisit = function installRareAtlasVisit(){
"use strict";
const A=window.app,w=A?.world,L=window.RareAtlasLive,R=window.RareAtlasInteractive,M=window.RareAtlasMondoFloor;
const THREE=window.Atlas3D?.THREE;
if(!w||!L||!R||!M||!THREE)throw new Error("The existing library and Mondo floor must be ready.");
if(window.RareAtlasVisit?.world===w)return "The welcome screen, spoken tour and lift are already installed.";
const $=id=>document.getElementById(id),ui=$("rai-ui"),resources=[],offs=[];
const own=o=>(resources.push(o),o),on=(el,type,fn,opt)=>{el.addEventListener(type,fn,opt);offs.push(()=>el.removeEventListener(type,fn,opt));};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x);};
const oldStart=L.startTour,oldDescend=M.descend;
const v={world:w,disposed:false,ride:null,utterance:null,speaking:false,muted:false,token:null,index:-1,paused:false,last:0,raf:0,welcomeOpen:false};
const style=document.createElement("style");
style.id="ra-visit-style";
style.textContent=`
#ra-welcome{position:fixed;inset:0;margin:auto;width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:clamp(24px,5vw,48px);border:1px solid #9cc9d65c;border-radius:22px;background:linear-gradient(135deg,#102534fa,#08141ffb);color:#e2eff4;box-shadow:0 32px 120px #000a;pointer-events:auto}
#ra-welcome::backdrop{background:#020812b8;backdrop-filter:blur(5px)}
#ra-welcome .rv-eyebrow{font:10px system-ui;letter-spacing:2.5px;color:#a1cad8}
#ra-welcome h1{font:clamp(40px,7vw,66px)/1.05 Georgia,serif;margin:22px 0 12px}
#ra-welcome .rv-intro{font:17px/1.65 Georgia,serif;color:#bbd2df;max-width:550px}
#ra-welcome .rv-features{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}
#ra-welcome .rv-features span{border:1px solid #91bed332;border-radius:30px;padding:7px 12px;font:11px system-ui;color:#b7d3df}
#ra-welcome .rv-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
#ra-welcome button{padding:17px 16px;font-size:14px;border-radius:11px;text-align:left}
#ra-welcome button small{display:block;margin-top:5px;font-size:11px;font-weight:400;opacity:.75}
#ra-welcome .rv-note{font:11px/1.7 system-ui;color:#8facbf;margin:22px 0 0}
#ra-lift-call{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;z-index:45;box-shadow:0 4px 24px #0008;background:#102b3bf5!important;border-color:#a7d5e7!important;font-size:11px}
#ra-lift-hud{position:absolute;top:105px;left:50%;transform:translateX(-50%);width:min(330px,calc(100% - 30px));padding:14px 18px;border:1px solid #acdbe35c;border-radius:12px;background:#081723f5;text-align:center;pointer-events:auto;z-index:65}
#ra-lift-hud strong{display:block;font:22px Georgia,serif;margin:5px 0}
#ra-lift-hud small{font-size:10px;letter-spacing:1px;color:#abcbd8}
#ra-speech-status{font:9px system-ui;letter-spacing:0;color:#b6d3df}
#ra-speech-retry{color:#edd5a5!important}
@media(max-width:540px){#ra-welcome .rv-choices{grid-template-columns:1fr}#ra-welcome h1{margin-top:14px}#ra-welcome .rv-features{margin:16px 0}#ra-lift-hud{top:120px}}
@media(max-height:550px){#ra-welcome{padding:22px 32px}#ra-welcome h1{font-size:40px;margin:12px 0 8px}#ra-welcome .rv-intro{font-size:14px}#ra-welcome .rv-features{margin:14px 0}#ra-welcome .rv-choices{margin-top:14px}#ra-welcome .rv-note{margin-top:14px}}
`;
document.head.append(style);
const welcome=document.createElement("dialog");
welcome.id="ra-welcome";welcome.setAttribute("aria-labelledby","ra-welcome-title");
welcome.innerHTML=`<div class="rv-eyebrow">RARE ATLAS / THE RESEARCH LIBRARY</div><h1 id="ra-welcome-title">Welcome to<br>Rare Atlas.</h1><p class="rv-intro">Follow a question through the library. Inspect its sources, sit with the research, and take the lift to the Mondo galleries below.</p><div class="rv-features"><span>Source-linked evidence</span><span>Two connected floors</span><span>A spoken 60-second tour</span></div><div class="rv-choices"><button id="ra-enter-library" class="ra-primary">Enter library ↗<small>Explore at your own pace</small></button><button id="ra-enter-tour">Take guided tour ▷<small>60 seconds · narration and captions</small></button></div><p class="rv-note">Tour narration uses your browser’s available voice; no microphone is needed. Mic still opens the separate live clerk conversation. Research services retain their actual connection status.<br>Not medical advice.</p>`;
const nav=document.createElement("button");nav.id="ra-lift-nav";nav.textContent="Lift ⇅";nav.title="Ride between the library and the Mondo floor";ui.querySelector(".ra-bar .ra-group").append(nav);
const worldCall=document.createElement("button");worldCall.id="ra-lift-call";worldCall.hidden=true;
const hud=document.createElement("section");hud.id="ra-lift-hud";hud.hidden=true;hud.setAttribute("role","status");hud.innerHTML='<small>RARE ATLAS / PASSENGER LIFT</small><strong id="ra-lift-display">Library → Mondo</strong><small id="ra-lift-phase">Boarding</small>';
ui.append(welcome,worldCall,hud);
const speechButton=document.createElement("button");speechButton.id="ra-tour-sound";speechButton.textContent="Speech on";speechButton.setAttribute("aria-pressed","true");
const speechStatus=document.createElement("span");speechStatus.id="ra-speech-status";
const retry=document.createElement("button");retry.id="ra-speech-retry";retry.textContent="Enable speech";retry.hidden=true;
$("ra-tour").querySelector(".ra-tour-top").append(speechButton,retry);$("ra-tour-copy").after(speechStatus);
function status(t){speechStatus.textContent=t;}
function caption(t){L.state.captions.current=t;L.state.captions.role="TOUR";$("ra-caption-label").textContent="TOUR";$("ra-caption-text").textContent=t;$("ra-caption").hidden=!t;}
function cancelSpeech(){
 const had=v.utterance;v.utterance=null;v.speaking=false;
 if(had)try{window.speechSynthesis?.cancel();}catch (_) { console.error("[build]", _); }
 if($("ra-mic").getAttribute("aria-pressed")!=="true"){w.voice.target=L.state.busy?"thinking":"idle";w.voice.levelTarget=0;}
 if(L.state.captions.role==="TOUR")caption("");
}
function narration(i){
 const ready=!!L.state.floor;
 return [
 "Welcome to Rare Atlas. I’m your clerk. Let’s explore the library, its evidence desk, and the Mondo floor.",
 "These collections organise genes, mechanisms, and research. Search the live Atlas for records. A similar name alone is not evidence.",
 L.state.edges.size?"Open an evidence card to inspect its sources, confidence, and limitations. Solid links are observations; dashed links are leads to check.":"Source cards appear only when real records arrive. If Atlas is unavailable, the desk says so. Nothing is invented.",
 "Sit at a computer to browse fetched records. Its working screen opens each record on the evidence desk.",
 "A brief needs real Atlas citations. Review its gaps, then print, save a PDF, or share it yourself.",
 "Now take the lift to the lower floor. Watch the doors close as we descend to the Mondo galleries.",
 ready?"Each coloured tile is an ontology term. Nearby name cards reveal its Mondo identifier. Search or choose a gallery.":"This floor needs the real Mondo file. If it cannot load, no sample records are substituted.",
 ready?"Here is the Mondo collection. Use the lift to travel between floors. Ontology terms are not treatment recommendations. Not medical advice.":"Explore the library and use the lift between floors. Unavailable services remain clearly labelled. This is not medical advice."
 ][i]||"";
}
function speak(i){
 cancelSpeech();const text=narration(i);caption(text);
 if(v.muted){status("Narration muted · captions remain on");return;}
 if($("ra-mic").getAttribute("aria-pressed")==="true"){status("Live clerk narration");return;}
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){status("Browser speech is unavailable · captions remain on");retry.hidden=false;return;}
 try{
  const synth=window.speechSynthesis,voices=synth.getVoices();
  const voice=voices.find(x=>x.localService&&/^en\b/i.test(x.lang))||voices.find(x=>/^en\b/i.test(x.lang));
  const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang=voice?.lang||"en-US";
  const seconds=[7,8,8,8,8,8,7,6][i];u.rate=Math.max(1.02,Math.min(1.35,text.split(/\s+/).length/(seconds*2.55)));u.pitch=1;
  v.utterance=u;status("Starting browser narration…");retry.hidden=false;
  u.onstart=()=>{if(v.utterance!==u)return;v.speaking=true;status("Browser narration");retry.hidden=true;};
  u.onboundary=()=>{if(v.utterance===u)w.voice.levelTarget=.46;};
  u.onend=()=>{if(v.utterance!==u)return;v.utterance=null;v.speaking=false;w.voice.levelTarget=0;};
  u.onerror=e=>{if(v.utterance!==u)return;v.utterance=null;v.speaking=false;w.voice.levelTarget=0;status("Speech unavailable or blocked · tap Enable speech");retry.hidden=false;};
  synth.resume();synth.speak(u);
 }catch(_){status("Browser speech was blocked · tap Enable speech");retry.hidden=false;}
}
function startTour(){closeWelcome();oldStart();v.token=L.state.tour?.token;v.index=0;v.paused=false;speak(0);}
L.startTour=startTour;
on(speechButton,"click",()=>{v.muted=!v.muted;speechButton.textContent=v.muted?"Speech off":"Speech on";speechButton.setAttribute("aria-pressed",String(!v.muted));if(v.muted){cancelSpeech();status("Narration muted · captions remain on");}else if(L.state.tour)speak(Math.max(0,L.state.tour.index));});
on(retry,"click",()=>{if(L.state.tour)speak(Math.max(0,L.state.tour.index));});
on(ui,"click",e=>{const b=e.target.closest("button");if(b?.dataset.action==="tour"){e.preventDefault();e.stopImmediatePropagation();startTour();}},true);
const liftRoot=new THREE.Group();liftRoot.name="Rare Atlas passenger lift";w.scene.add(liftRoot);
const box=own(new THREE.BoxGeometry(1,1,1));
const metal=own(new THREE.MeshStandardMaterial({color:"#456474",metalness:.72,roughness:.32}));
const dark=own(new THREE.MeshStandardMaterial({color:"#0d202d",metalness:.3,roughness:.65}));

function block(parent,mat,x,y,z,sx,sy,sz){const o=new THREE.Mesh(box,mat);o.position.set(x,y,z);o.scale.set(sx,sy,sz);parent.add(o);return o;}

block(liftRoot,dark,X,-58.5,Z-1.4,3,123,.12);
function sign(parent,label,y){
 const c=document.createElement("canvas");c.width=768;c.height=160;const ctx=c.getContext("2d");
 ctx.fillStyle="#0b2030";ctx.fillRect(0,0,768,160);ctx.strokeStyle="#8cbdce";ctx.lineWidth=3;ctx.strokeRect(2,2,764,156);
 ctx.fillStyle="#def3f6";ctx.textAlign="center";ctx.font="36px Georgia";ctx.fillText(label,384,70);ctx.fillStyle="#94baca";ctx.font="22px system-ui";ctx.fillText("PASSENGER LIFT  /  RARE ATLAS",384,118);

 sign(liftRoot,y===0?"LIBRARY  →  MONDO ↓":"MONDO  →  LIBRARY ↑",y);
}
for(let i=1;i<15;i++)block(liftRoot,light,X,-i*8,Z-1.32,2.5,.035,.018);
const cabin=new THREE.Group();cabin.position.set(X,M.state.level==="mondo"?-120:0,Z);liftRoot.add(cabin);
block(cabin,dark,0,-.005,0,2.7,.13,2.6);block(cabin,dark,0,3.16,0,2.7,.12,2.6);block(cabin,metal,0,1.58,-1.26,2.7,3.16,.075);
for(const x of [-1.32,1.32]){block(cabin,glass,x,1.6,0,.05,3,2.5);block(cabin,light,x*.96,2.96,0,.035,.035,2.35);block(cabin,metal,x*.93,1.03,0,.055,.055,2.2);}
block(cabin,light,0,3.075,0,1.7,.03,.48);
const doors=[-1,1].map(s=>({side:s,mesh:block(cabin,metal,s*.65,1.56,1.26,1.29,3.08,.065)}));
function openDoors(amount){for(const d of doors)d.mesh.position.x=d.side*(.65+amount*1.23);}
openDoors(1);
let savedWelcome=null;
function showWelcome(){
 if(v.welcomeOpen)return;
 L.stopTour();cancelSpeech();savedWelcome={walk:L.state.walk,fly:L.state.fly,floorFly:M.state.fly};
 L.state.fly=null;L.state.walk=false;L.state.keys.clear();M.state.fly=null;M.state.keys.clear();v.welcomeOpen=true;
 try{welcome.showModal();}catch(_){welcome.setAttribute("open","");}
 $("ra-enter-library").focus({preventScroll:true});
}
function closeWelcome(){
 if(!v.welcomeOpen)return;v.welcomeOpen=false;if(welcome.close)welcome.close();else welcome.removeAttribute("open");
 if(savedWelcome){L.state.walk=savedWelcome.walk;L.state.fly=savedWelcome.fly;M.state.fly=savedWelcome.floorFly;$("rai-walk").setAttribute("aria-pressed",String(L.state.walk));}savedWelcome=null;
}
on(welcome,"cancel",e=>{e.preventDefault();closeWelcome();});
on($("ra-enter-library"),"click",()=>{closeWelcome();w.renderer.domElement.focus({preventScroll:true});});
on($("ra-enter-tour"),"click",startTour);
function applyLevel(lower){
 const s=M.state;
 if(lower&&s.level!=="mondo"){s.beforeInspector=$("rai-inspector").hidden;if(w.scene.fog){s.fogDensity=w.scene.fog.density;w.scene.fog.density=.0045;}}
 else if(!lower&&s.level==="mondo"&&w.scene.fog&&s.fogDensity!=null)w.scene.fog.density=s.fogDensity;
 s.level=lower?"mondo":"library";s.overview=false;s.fly=null;s.drag=null;s.keys.clear();s.near=false;
 $("rmf-overview").setAttribute("aria-pressed","false");$("rmf-panel").hidden=lower?matchMedia("(max-width:700px)").matches:true;
 $("rmf-dock").hidden=!lower;$("rmf-tip").hidden=true;$("rmf-hint").hidden=true;
 $("rmf-where").textContent="Mondo floor · "+(s.data?s.data.n.toLocaleString()+" rare diseases":"data unavailable");
 $("rai-inspector").hidden=lower?true:(L.state.drawer?false:s.beforeInspector);
 if(!lower)for(const c of M.root.children)if(c.userData.mondoCard){c.visible=false;if(c.userData.stem)c.userData.stem.visible=false;}
}
function ride(lower,fromTour=false){
 if(v.ride)return v.ride.promise;if(M.state.busy)return Promise.resolve(false);if((M.state.level==="mondo")===lower)return Promise.resolve(true);

const inside=new THREE.Vector3(),look=new THREE.Vector3(),exit=new THREE.Vector3(),projected=new THREE.Vector3();
function updateRide(dt){
 const r=v.ride;if(!r)return;if(!L.state.tour?.paused)r.t+=dt;
 L.state.fly=null;L.state.keys.clear();L.state.walk=false;M.state.fly=null;M.state.keys.clear();w.pointer.tx=w.pointer.ty=0;
 const t=r.t;cabin.position.y=r.from+(r.to-r.from)*ease((t-1.55)/3.05);

 if(t<.95){w.cam.p.copy(r.p).lerp(inside,ease(t/.95));w.cam.target.copy(r.look).lerp(look,ease(t/.95));}else{w.cam.p.copy(inside);w.cam.target.copy(look);}
 openDoors(t<.95?1:t<1.55?1-ease((t-.95)/.6):t<4.6?0:ease((t-4.6)/.6));
 if(t>=4.6&&!r.switched){r.switched=true;applyLevel(r.lower);}
 if(t>5.2){exit.set(X,r.to+1.7,Z+3.05);w.cam.p.lerp(exit,ease((t-5.2)/.85));look.set(-1,r.to+1.4,Z+4);w.cam.target.lerp(look,ease((t-5.2)/.85));}

 if(t>=6.05){cabin.position.y=r.to;openDoors(1);M.state.busy=false;v.ride=null;hud.hidden=true;L.state.walk=!r.lower&&!L.state.tour;$("rai-walk").setAttribute("aria-pressed",String(L.state.walk));$("ra-movement").hidden=!L.state.walk;$("rai-status").textContent=r.lower?"Mondo floor reached. Lift ⇅ returns to the library.":"Library reached. Your research is unchanged.";r.resolve(true);}
}
function tick(ms){
 if(v.disposed)return;if(A.world!==w||L.state.disposed){dispose();return;}
 const dt=v.last?Math.min(.06,(ms-v.last)/1000):0;v.last=ms;
 if(!document.hidden){
  updateRide(dt);const t=L.state.tour;
  if(t){const i=Math.max(0,t.index);if(t.token!==v.token||i!==v.index){v.token=t.token;v.index=i;speak(i);}
   if(t.paused!==v.paused){v.paused=t.paused;try{if(t.paused)window.speechSynthesis?.pause();else window.speechSynthesis?.resume();}catch (_) { console.error("[build]", _); }}
   const copy=narration(i);if($("ra-tour-copy").textContent!==copy)$("ra-tour-copy").textContent=copy;if(i===5)$("ra-tour-title").textContent="Take the lift to Mondo.";
   if(v.speaking&&!v.paused&&$("ra-mic").getAttribute("aria-pressed")!=="true"){w.voice.target="speaking";w.voice.levelTarget=Math.max(.18,w.voice.levelTarget-dt*.4);}
  }else if(v.token!==null){v.token=null;v.index=-1;cancelSpeech();}
  const lower=M.state.level==="mondo";if(!v.ride)cabin.position.y=lower?-120:0;
  projected.set(X,(lower?-120:0)+1.55,Z+1.55).project(w.camera);
  const distance=Math.hypot(w.cam.p.x-X,w.cam.p.z-Z);
  worldCall.hidden=v.welcomeOpen||!!v.ride||!!t||M.state.overview||projected.z< -1||projected.z>1||Math.abs(projected.x)>.9||Math.abs(projected.y)>.8||distance>25;
  if(!worldCall.hidden){worldCall.textContent=lower?"Lift to library ↑":"Lift to Mondo ↓";worldCall.style.left=(projected.x+1)*w.width*.5+"px";worldCall.style.top=(1-projected.y)*w.height*.5+"px";}
  nav.disabled=!!v.ride;nav.title=lower?"Ride up to the library":"Ride down to the Mondo floor";
 }
 v.raf=requestAnimationFrame(tick);
}
on(document,"visibilitychange",()=>{v.last=0;if(document.hidden){try{window.speechSynthesis?.pause();}catch (_) { console.error("[build]", _); }}else if(L.state.tour&&!L.state.tour.paused){try{window.speechSynthesis?.resume();}catch (_) { console.error("[build]", _); }}});
on(window,"pagehide",cancelSpeech);
function dispose(){
 if(v.disposed)return;v.disposed=true;cancelAnimationFrame(v.raf);cancelSpeech();
 if(v.ride){applyLevel(v.ride.lower);M.state.busy=false;v.ride.resolve(false);v.ride=null;}
 offs.forEach(fn=>fn());liftRoot.removeFromParent();resources.forEach(r=>r.dispose());
 [welcome,worldCall,hud,nav,speechButton,speechStatus,retry,style].forEach(n=>n.remove());
 if(L.startTour===startTour)L.startTour=oldStart;M.descend=oldDescend;if(window.RareAtlasVisit===v)delete window.RareAtlasVisit;
}
Object.assign(v,{showWelcome,startTour,ride,dispose});window.RareAtlasVisit=v;
showWelcome();v.raf=requestAnimationFrame(tick);
return "Prepared welcome choices, browser-spoken 60-second tour and a two-way animated passenger lift; existing scene, records, controls and live voice connection retained.";
};

function replaceRequired(source,oldText,newText,label){
 const at=source.indexOf(oldText);
 if(at<0)throw new Error("The attached library does not match the expected "+label+". No partial installer was accepted.");
 return source.slice(0,at)+newText+source.slice(at+oldText.length);
}
function replaceRegion(source,start,end,replacement,label){
 const a=source.indexOf(start),b=source.indexOf(end,a+start.length);
 if(a<0||b<0)throw new Error("Could not locate "+label+" in the attached library.");
 return source.slice(0,a)+replacement+"\n"+source.slice(b);
}

 s=s.slice(0,tail)+`
queueMicrotask(()=>{if(!A.world&&!A.queue.length)enqueue('init',{container:document.getElementById('atlas'),options:{},demo:false},true);});
})();`;
 s=replaceRequired(s,"for(let i=0;i<Math.min(6,w.order.length);i++){","for(let i=0;i<w.order.length;i++){","individual evidence objects");

 async function action(name){
