        $('rai-command-input').value=transcript.trim();
        if(e.results[e.results.length-1].isFinal){command(transcript);try{recognition.stop()}catch (_) { console.error("[build]", _); }}
      };
      recognition.onerror=()=>micFallback('Local speech recognition could not complete. You can continue by typing; no external service is contacted.');
      recognition.onend=()=>{if(state.recognition===recognition)state.recognition=null;$('rai-mic').textContent='Mic';speechIdle();};
      recognition.start();
    }catch(error){
      state.recognition=null;$('rai-mic').textContent='Mic';speechIdle();
      micFallback('Local microphone access is unavailable in this sandbox. Typed commands provide the same navigation actions.');
    }
  };
  const tourSteps=[
    ['Start with one condition.','case','Select a diagnosis, confirm what the atlas represents, and inspect its source.'],
    ['Follow the mechanism.','process','A useful connection needs a compatible biological effect—not just a similar name.'],
    ['Find existing work.','registry','A registry design might reduce duplicate work, but access and suitability must be checked.'],
    ['Reject a tempting match.','counter','A similar phenotype with an opposite effect is not the same therapeutic opportunity.'],
    ['Leave with a next step.','brief','Prepare a reviewable proposal with limitations, expert questions, and source assertions.']
  ];
  const showTourStep=()=>{
    const step=tourSteps[state.tour];if(!step)return;
    $('rai-tour').hidden=false;$('rai-tour-step').textContent='INTERACTIVE TOUR · '+(state.tour+1)+' / '+tourSteps.length;
    $('rai-tour-text').textContent=step[0]+' '+step[2];
    focusMap();if(step[1]==='brief')brief();else inspectNode(step[1]);
  };
  const startTour=()=>{state.tour=0;showTourStep();};
  const nextTour=()=>{
    state.tour++;
    if(state.tour>=tourSteps.length){
      stopTour();feed('Tour complete. You can now collect objects, add notes, challenge a link, and export a reviewable packet.',false);
      try{if(window.AskSary&&typeof window.AskSary.experienceEnded==='function')window.AskSary.experienceEnded()}catch (_) { console.error("[build]", _); }
    }else showTourStep();
  };
  const action = name => {
    if(!['tour','next-tour','end-tour','narrate'].includes(name))stopTour();
    if(name==='map'){setMap(!state.map);return;}
    if(name==='walk'){toggleWalk();return;}
    if(name==='overview'){overview();return;}
    if(name==='approach'){state.fly=null;state.walk=false;$('rai-walk').setAttribute('aria-pressed','false');API.approach();return;}
    if(name==='collect'){collect();return;}
    if(name==='retrieve'){run('Retrieving a research object…',()=>retrieve(state.selected));return;}
    if(name==='explain'){explain();return;}
    if(name==='compare'){compare();return;}
    if(name==='brief'){brief();return;}
    if(name==='export'||name==='markdown'){exportPacket(name==='markdown');return;}
    if(name==='gap'){gap();return;}
    if(name==='inferred'){state.inferred=!state.inferred;$('rai-inferred').setAttribute('aria-pressed',String(state.inferred));state.dirty=true;return;}
    if(name==='counter'){state.counter=!state.counter;$('rai-counter').setAttribute('aria-pressed',String(state.counter));state.dirty=true;return;}
    if(name==='legend'){inspectEdge('E1');return;}
    if(name==='close'){state.drawer=false;$('rai-inspector').hidden=true;return;}
    if(name==='guide'){ $('rai-command').hidden=!$('rai-command').hidden;if(!$('rai-command').hidden)$('rai-command-input').focus();return;}
    if(name==='close-guide'){stopSpeech();$('rai-command').hidden=true;return;}
    if(name==='mic'){microphone();return;}
    if(name==='narrate'){
      state.narrate=!state.narrate;$('rai-narrate').setAttribute('aria-pressed',String(state.narrate));
      if(state.narrate){
        const local=window.speechSynthesis&&window.speechSynthesis.getVoices().some(v=>v.localService);
        if(local)feed('Local narration is enabled. You can interrupt it by asking another question or switching narration off.');
        else feed('Narration is enabled when a local system voice becomes available. Written explanations remain available; no remote voice is loaded.',false);
      }else stopSpeech();
      return;
    }
    if(name==='help'){showDialog('rai-help');return;}
    if(name==='close-help'){hideDialog('rai-help');return;}
    if(name==='note'){showDialog('rai-note');return;}
    if(name==='close-note'){hideDialog('rai-note');return;}
    if(name==='reset-layout'){for(const n of nodes)visualNodes.get(n.id).root.position.fromArray(n.position);state.dirty=true;return;}
    if(name==='tour'){startTour();return;}
    if(name==='next-tour'){nextTour();return;}
    if(name==='end-tour'){stopTour();return;}
    if(name==='link'){state.linkMode=!state.linkMode;state.linkFirst=null;setMap(true);$('rai-link').setAttribute('aria-pressed',String(state.linkMode));feed(state.linkMode?'Choose two research nodes. Your added link will be marked hypothetical.':'Link mode cancelled.',false);return;}
    if(name==='bind'){run('Binding the current research desk…',async()=>{await API.bind();brief();feed('The existing desk objects are bound into a folio. This action does not validate their contents or send the proposal.',false)});return;}
    if(name==='clear'){
      if(performance.now()>state.clearUntil){state.clearUntil=performance.now()+5000;feed('Click Clear desk again within five seconds to confirm. Export first if you need a copy.',false);const b=ui.querySelector('[data-action="clear"]');if(b)b.textContent='Confirm clear';return;}
      state.clearUntil=0;run('Clearing the desk…',async()=>{await API.clearDesk();brief();feed('The desk is clear. The library and synthetic connection map are unchanged.',false)});return;
    }
  };
  on(ui,'click',e=>{
    const button=e.target.closest('button');if(!button||!ui.contains(button)||button.disabled)return;
    if(button.dataset.node){stopTour();chooseNode(button.dataset.node);$('rai-results').hidden=true;return;}
    if(button.dataset.collection!==undefined){stopTour();visit(Number(button.dataset.collection));return;}
    if(button.dataset.action)action(button.dataset.action);
  });
  on(ui,'keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'){
      if($('rai-note').open){hideDialog('rai-note');return;}
      if($('rai-help').open){hideDialog('rai-help');return;}
      $('rai-results').hidden=true;state.drawer=false;$('rai-inspector').hidden=true;
      $('rai-command').hidden=true;stopSpeech();stopTour();
    }
  });
  const search = () => {
    const q=$('rai-search').value.trim().toLowerCase(),results=$('rai-results');
    if(!q){results.hidden=true;return;}
    const matches=nodes.filter(n=>(n.label+' '+n.tags+' '+n.type).toLowerCase().includes(q)).slice(0,6);
    const sections=w.sections.filter(s=>s.labelText.toLowerCase().includes(q)).slice(0,3);
    results.innerHTML=matches.map(n=>`<button type="button" data-node="${n.id}"><span>${escape(n.label)}</span><small>${escape(n.type)}</small></button>`).join('')+
      sections.map(s=>`<button type="button" data-collection="${s.index}"><span>${escape(s.labelText)}</span><small>Collection</small></button>`).join('')+
      (!matches.length&&!sections.length?'<p class="ra-muted" style="padding:8px">No match in this synthetic slice. No outside database was searched.</p>':'');
    results.hidden=false;
  };
  on($('rai-search'),'input',search);
  on($('rai-search-form'),'submit',e=>{
    e.preventDefault();const q=$('rai-search').value.trim().toLowerCase();
    const n=nodes.find(n=>(n.label+' '+n.tags+' '+n.type).toLowerCase().includes(q));
    if(n&&q){focusMap();chooseNode(n.id);$('rai-results').hidden=true;}else search();
  });
  on($('rai-command-form'),'submit',e=>{e.preventDefault();stopSpeech();command($('rai-command-input').value);});
  on($('rai-note-form'),'submit',e=>{
    e.preventDefault();
    const title=$('rai-note-title').value.trim();if(!title)return;
    const id='rai-user-'+Date.now().toString(36)+'-'+(++A.serial);
    const data={id,title,source:$('rai-note-source').value.trim(),kind:$('rai-note-kind').value,basis:$('rai-note-basis').value};
    const summary=$('rai-note-summary').value.trim();
    run('Placing your unverified research note…',async()=>{
      state.notes.set(id,{summary,verification:'user-supplied; not checked'});
      await API.fetch([data],{sectionId:w.sections.find(s=>s.index===({gene:0,symptom:2,study:3,registry:4,group:5,model:6}[data.kind]??1)%w.sections.length).id});
      hideDialog('rai-note');$('rai-note-form').reset();inspectNote(id);
      feed('Your note is on the desk and is marked user-supplied, not independently verified.',false);
    });
  });
  removers.push(API.on('select',inspectNote));
  const canvas=w.renderer.domElement,ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  ray.params.Line.threshold=.065;
  const rayFor = e => {
    const b=canvas.getBoundingClientRect();
    ndc.set((e.clientX-b.left)/Math.max(1,b.width)*2-1,-(e.clientY-b.top)/Math.max(1,b.height)*2+1);
    ray.setFromCamera(ndc,w.camera);
  };
  const hit = (e,withOriginal=false) => {
    rayFor(e);
    const objects=withOriginal?[...pickObjects,...w.pick]:pickObjects;
    const hits=ray.intersectObjects(objects,true);
    for(const h of hits){
      let object=h.object;
      while(object){
        if(object===graph&&!state.map)break;
        const meta=pickMeta.get(object);
        if(meta){
          if(meta.type==='node'&&!visualNodes.get(meta.id).root.visible)break;
          if(meta.type==='edge'&&!visualEdges.get(meta.id).line.visible)break;
          return {...meta,point:h.point};
        }
        if(withOriginal&&object.userData.docId)return{type:'document',id:object.userData.docId};
        if(withOriginal&&object.userData.desk)return{type:'desk'};
        if(withOriginal&&w.folio&&object===w.folio.root)return{type:'folio'};
        object=object.parent;
      }
    }
    return null;
  };
  const consume = e => {e.preventDefault();e.stopImmediatePropagation();};
  const capture = e => {try{canvas.setPointerCapture(e.pointerId)}catch (_) { console.error("[build]", _); }};
  on(canvas,'pointerdown',e=>{
    if(e.button!==0&&e.button!==2)return;
    const h=hit(e,true);
    if(e.button===0&&h&&(h.type==='document'||h.type==='desk'))return;
    stopTour();$('rai-results').hidden=true;
    state.fly=null;state.keys.clear();stopSpeech();
    const gesture={kind:'orbit',hit:h,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false,pointerId:e.pointerId};
    if(h&&h.type==='node'&&e.button===0){
      gesture.kind='node';gesture.id=h.id;
      const world=visualNodes.get(h.id).root.getWorldPosition(new THREE.Vector3());
      gesture.plane=new THREE.Plane().setFromNormalAndCoplanarPoint(w.camera.getWorldDirection(new THREE.Vector3()),world);
    }else if(h&&e.button===0)gesture.kind='click';
    state.gesture=gesture;capture(e);canvas.focus({preventScroll:true});consume(e);
  },true);
  const hoverPoint=new THREE.Vector3(),spherical=new THREE.Spherical(),relative=new THREE.Vector3();
  on(canvas,'pointermove',e=>{
    const g=state.gesture;
    if(g){
      const dx=e.clientX-g.lastX,dy=e.clientY-g.lastY;g.lastX=e.clientX;g.lastY=e.clientY;
      if(Math.abs(e.clientX-g.x)+Math.abs(e.clientY-g.y)>6)g.moved=true;
      if(g.kind==='node'&&g.moved){
        rayFor(e);
        if(ray.ray.intersectPlane(g.plane,hoverPoint)){
          graph.worldToLocal(hoverPoint);
          hoverPoint.x=clamp(hoverPoint.x,-4.5,4.5);hoverPoint.y=clamp(hoverPoint.y,-1.1,2.3);hoverPoint.z=clamp(hoverPoint.z,-.75,.75);
          visualNodes.get(g.id).root.position.copy(hoverPoint);state.dirty=true;
        }
      }else if(g.kind==='orbit'||(g.kind==='click'&&g.moved)){
        if(state.walk){
          relative.copy(w.cam.target).sub(w.cam.p);spherical.setFromVector3(relative);
          spherical.theta-=dx*.005;spherical.phi=clamp(spherical.phi+dy*.004,.52,2.1);spherical.radius=8;
          relative.setFromSpherical(spherical);w.cam.target.copy(w.cam.p).add(relative);
        }else{
          relative.copy(w.cam.p).sub(w.cam.target);spherical.setFromVector3(relative);
          spherical.theta-=dx*.0045;spherical.phi=clamp(spherical.phi+dy*.004,.25,1.47);
          relative.setFromSpherical(spherical);w.cam.p.copy(w.cam.target).add(relative);
        }
      }
      $('rai-tooltip').hidden=true;consume(e);return;
    }
    if(performance.now()-state.hoverAt<65)return;
    state.hoverAt=performance.now();
    const h=hit(e),tooltip=$('rai-tooltip');
    state.hovered=h&&h.type==='node'?h.id:null;
    if(h){
      const label=h.type==='node'?byId.get(h.id).label:h.type==='edge'?edges.find(x=>x.id===h.id).label:h.type==='section'?w.sections[h.index].labelText+' · click to visit':'Ask the atlas guide';
      tooltip.textContent=label;
      const b=w.host.getBoundingClientRect();
      tooltip.style.left=clamp(e.clientX-b.left+13,10,Math.max(10,w.width-235))+'px';
      tooltip.style.top=clamp(e.clientY-b.top+12,65,Math.max(65,w.height-100))+'px';
      tooltip.hidden=false;canvas.style.cursor=h.type==='node'?'grab':'pointer';
      e.stopImmediatePropagation();
    }else tooltip.hidden=true;
  },true);
  const endPointer = e => {
    const g=state.gesture;if(!g)return;
    state.gesture=null;try{canvas.releasePointerCapture(g.pointerId)}catch (_) { console.error("[build]", _); }
    if(!g.moved&&g.hit){
      if(g.hit.type==='node')chooseNode(g.hit.id);
      else if(g.hit.type==='edge')inspectEdge(g.hit.id);
      else if(g.hit.type==='section')visit(g.hit.index);
      else if(g.hit.type==='guide'){$('rai-command').hidden=false;feed('Ask me to show a collection, explain a connection, compare conditions, or prepare a brief. This is an offline command guide.',false);}
      else if(g.hit.type==='folio')brief();
    }
    consume(e);
  };
  on(canvas,'pointerup',endPointer,true);
  on(canvas,'pointercancel',e=>{state.gesture=null;$('rai-tooltip').hidden=true;consume(e)},true);
  on(canvas,'pointerleave',()=>{if(!state.gesture){state.hovered=null;$('rai-tooltip').hidden=true}});
  on(canvas,'contextmenu',e=>e.preventDefault());
  on(canvas,'wheel',e=>{
    consume(e);state.fly=null;stopTour();
    if(state.walk)return;
    relative.copy(w.cam.p).sub(w.cam.target);const distance=relative.length();
    relative.normalize().multiplyScalar(clamp(distance*Math.exp(e.deltaY*.001),4.2,38));
    w.cam.p.copy(w.cam.target).add(relative);
  },{passive:false,capture:true});
  const walkKeys=new Set(['w','a','s','d','arrowleft','arrowright','arrowup','arrowdown','shift']);
  on(window,'keydown',e=>{
    if(ui.contains(e.target)||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
    const k=e.key.toLowerCase();
    if(state.walk&&walkKeys.has(k)){state.keys.add(k);state.fly=null;stopTour();consume(e);return;}
    if(e.repeat)return;
    if(/^[1-7]$/.test(k)){const index=Number(k)-1;if(index<w.sections.length){visit(index);consume(e)}return;}
    if(k==='m'){action('map');consume(e);}
    else if(k==='/'){ $('rai-command').hidden=false;$('rai-command-input').focus();consume(e);}
    else if(k==='escape'){
      stopTour();stopSpeech();state.fly=null;state.walk=false;$('rai-walk').setAttribute('aria-pressed','false');
      if(state.drawer||!$('rai-command').hidden){state.drawer=false;$('rai-inspector').hidden=true;$('rai-command').hidden=true;consume(e)}
    }
  },true);
  on(window,'keyup',e=>{state.keys.delete(e.key.toLowerCase());});
  on(window,'blur',()=>{state.keys.clear();state.gesture=null;});
  on(document,'visibilitychange',()=>{
    state.last=0;state.keys.clear();
    if(document.hidden){stopSpeech();if(state.recognition)try{state.recognition.stop()}catch (_) { console.error("[build]", _); }}
  });
  const collides = p => {
    if(Math.hypot(p.x,p.z)>21.3)return true;
    if(Math.abs(p.x)<4.05&&p.z>1.5&&p.z<5.2)return true;
    for(const s of w.sections){
      const dx=p.x-Math.sin(s.angle)*s.radius,dz=p.z+Math.cos(s.angle)*s.radius;
      const x=dx*Math.cos(s.angle)+dz*Math.sin(s.angle),z=-dx*Math.sin(s.angle)+dz*Math.cos(s.angle);
      if(z>-.0-s.length-.4&&z<.4&&(Math.abs(x-s.width/2)<.74||Math.abs(x+s.width/2)<.74))return true;
    }
    return false;
  };
  const forward=new THREE.Vector3(),right=new THREE.Vector3(),step=new THREE.Vector3(),up=new THREE.Vector3(0,1,0),candidate=new THREE.Vector3();
  const animate = ms => {
    state.raf=0;
    if(state.disposed)return;
    if(A.world!==w){dispose();return;}
    const dt=state.last?Math.min(.045,(ms-state.last)/1000):1/60;state.last=ms;
    if(!document.hidden){
      const cameraBusy=A.active&&['approach','leave','reset'].includes(A.active.kind);
      if(state.fly&&!cameraBusy){
        const f=state.fly;f.elapsed+=dt;
        const t=clamp(f.elapsed/f.duration,0,1),ease=t*t*(3-2*t);
        w.cam.p.copy(f.from).lerp(f.to,ease);w.cam.target.copy(f.look).lerp(f.target,ease);
        if(t===1)state.fly=null;
      }else if(state.fly&&cameraBusy){state.fly.from.copy(w.cam.p);state.fly.look.copy(w.cam.target);state.fly.elapsed=0;}
      if(state.walk&&state.keys.size&&!state.fly&&!cameraBusy){
        forward.copy(w.cam.target).sub(w.cam.p);forward.y=0;forward.normalize();right.crossVectors(forward,up).normalize();
        const z=(state.keys.has('w')||state.keys.has('arrowup')?1:0)-(state.keys.has('s')||state.keys.has('arrowdown')?1:0);
        const x=(state.keys.has('d')||state.keys.has('arrowright')?1:0)-(state.keys.has('a')||state.keys.has('arrowleft')?1:0);
        step.copy(forward).multiplyScalar(z).addScaledVector(right,x);
        if(step.lengthSq()){
          step.normalize().multiplyScalar(dt*(state.keys.has('shift')?5:2.7));
          candidate.copy(w.cam.p);candidate.x+=step.x;
          if(!collides(candidate)){w.cam.p.x+=step.x;w.cam.target.x+=step.x}
          candidate.copy(w.cam.p);candidate.z+=step.z;
          if(!collides(candidate)){w.cam.p.z+=step.z;w.cam.target.z+=step.z}
        }
      }
      if(state.dirty)updateEdges();
      for(const n of nodes){
        const v=visualNodes.get(n.id),selected=state.selected===n.id||state.linkFirst===n.id,hovered=state.hovered===n.id;
        const pulse=w.reduced?1:1+Math.sin(A.time*1.8+n.position[0])*.025;
        v.core.scale.setScalar((selected?1.25:hovered?1.15:1)*pulse);
        v.ring.scale.setScalar(selected?1.2:1);
        v.ring.quaternion.copy(w.camera.quaternion);
        v.ring.material.opacity=selected ? .95 : hovered ? .85 : .35;
        v.glow.material.opacity=selected ? .58 : hovered ? .45 : .23;
      }
      if(state.utterance&&w.voice.target==='speaking')w.voice.levelTarget=Math.max(.16,w.voice.levelTarget-dt*.7);
      if(ms-state.uiAt>180){
        state.uiAt=ms;
        for(const b of ui.querySelectorAll('[data-action="collect"],[data-action="retrieve"],[data-action="bind"]'))b.disabled=state.busy;
        $('rai-status').textContent=state.busy?state.lastMessage:state.linkMode?'Choose two nodes · new links are hypotheses':state.walk?'WASD / arrows · Shift faster · drag to look':API.pending?'Desk animation · '+API.pending+' queued action'+(API.pending===1?'':'s'):(w.order.length||w.folio?'Research retained · '+w.order.length+' desk objects · '+w.threads.length+' links':'Drag to orbit · wheel to zoom · click shelves and nodes');
      }
    }
    state.raf=requestAnimationFrame(animate);
  };
  const dispose = () => {
    if(state.disposed)return;state.disposed=true;
    if(state.raf)cancelAnimationFrame(state.raf);
    if(state.recognition)try{state.recognition.stop()}catch (_) { console.error("[build]", _); }
    stopSpeech();
    for(const off of removers)try{off()}catch (_) { console.error("[build]", _); }
    for(const timer of timers)clearTimeout(timer);
    graph.removeFromParent();for(const r of resources)try{r.dispose()}catch (_) { console.error("[build]", _); }
    ui.remove();style.remove();
    if(A.interactive===state)delete A.interactive;
  };
  const controller={
    state,graph,nodes:visualNodes,edges:visualEdges,command,handleTranscript:command,
    inspect:inspectNode,inspectEdge,visit,collect,compare,brief,overview,focusMap,
    exportPacket,dispose,
    setVoice(value){if(value&&A.world===w){w.voice.target=['idle','listening','thinking','speaking'].includes(value.state)?value.state:'idle';w.voice.levelTarget=clamp(Number(value.level)||0,0,1)}},
    get packet(){return packet()}
  };
  window.RareAtlasInteractive=controller;A.interactive=state;
  graph.visible=true;
  state.raf=requestAnimationFrame(animate);
  return 'Added interactive shelves, draggable evidence nodes, camera exploration, research notes, a reviewable brief, exports, and a local voice/command guide. The existing scene, renderer, desk animations, and research objects were retained.';
};
let attempts=0;
const start=()=>{
  if(window.app&&window.app.world&&window.AtlasWorld){
    installRareAtlasInteractive();
    return;
  }
  if(++attempts<300)requestAnimationFrame(start);
};
start();
})();

  if(!document.hidden){
   if(state.level==="mondo"){
    R.state.walk=false;R.state.fly=null;R.state.keys.clear();w.pointer.tx=w.pointer.ty=0;
    if(state.fly){const f=state.fly;f.elapsed+=dt;const t=clamp(f.elapsed/f.duration,0,1),k=ease(t);w.cam.p.copy(f.from).lerp(f.to,k);w.cam.target.copy(f.look).lerp(f.target,k);if(t>=1)state.fly=null;}
    else if(!state.overview&&state.keys.size){
     forward.copy(w.cam.target).sub(w.cam.p);forward.y=0;forward.normalize();right.crossVectors(forward,up).normalize();
     const z=(state.keys.has("w")||state.keys.has("arrowup")?1:0)-(state.keys.has("s")||state.keys.has("arrowdown")?1:0);
     const x=(state.keys.has("d")||state.keys.has("arrowright")?1:0)-(state.keys.has("a")||state.keys.has("arrowleft")?1:0);
     step.copy(forward).multiplyScalar(z).addScaledVector(right,x);
     if(step.lengthSq()){step.normalize().multiplyScalar(dt*(state.keys.has("shift")?7:3.2));const nx=w.cam.p.x+step.x,nz=w.cam.p.z+step.z,r=Math.hypot(nx,nz);
      if(r<FLOOR_R-2.5&&r>.9){w.cam.p.x=nx;w.cam.p.z=nz;w.cam.target.x+=step.x;w.cam.target.z+=step.z;}}
     w.cam.p.y=LEVEL_Y+EYE;
    }
    for(const l of galleryLabels.children)if(l.userData.label){l.lookAt(w.cam.p);l.visible=state.overview||Math.hypot(l.position.x-w.cam.p.x,l.position.z-w.cam.p.z)>9;}
    updateCards();
    state.near=false;hint.hidden=true;
   }else{
    const nearStairs=R.state.walk&&!R.state.fly&&Math.hypot(w.cam.p.x-STAIR.x,w.cam.p.z-STAIR.z)<3.8&&!window.RareAtlasWorkstations?.state?.seat;
    state.near=nearStairs;hint.hidden=!nearStairs;
   }
  }
  state.raf=requestAnimationFrame(tick);
 }

 // ---------------------------------------------------------------- data
 async function fetchData(){
  for(const url of DATA_URLS){
   try{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),15000);const res=await fetch(url,{signal:ctrl.signal});clearTimeout(timer);if(!res.ok)continue;const json=await res.json();
    if(json?.format?.startsWith("mondo-floor-compact"))return{data:decode(json),source:url.startsWith("asksary-asset")?"library asset":new URL(url).hostname};
    if(Array.isArray(json?.records))return{data:fromRecords(json),source:url.startsWith("asksary-asset")?"library asset":new URL(url).hostname};
   }catch(error){console.warn("Mondo floor: could not load",url,error.message);}
  }
  if(window.MONDO_FLOOR_SAMPLE)return{data:decode(window.MONDO_FLOOR_SAMPLE),source:"embedded sample",notice:"sample only — the full set could not be fetched; upload mondo-floor.compact.json to the library as “mondo-floor” or set window.MONDO_FLOOR_URL"};
  throw new Error("No Mondo data could be loaded.");
 }
 function adopt({data,source,notice}){
  if(state.disposed)return;state.data=data;state.source=source;state.notice=notice||"";
  buildTiles(data);renderGalleries();refreshFilters();
  if(state.level==="mondo")get("rmf-where").textContent="Mondo floor · "+fmt(data.n)+" rare diseases";
  get("rmf-source").textContent="Mondo Disease Ontology"+(data.builtAt?" · built "+data.builtAt.slice(0,10):"")+" · "+fmt(data.n)+" terms · CC BY 4.0 · not medical advice.";
 }
 fetchData().then(adopt).catch(error=>{get("rmf-count").textContent="Mondo data unavailable: "+error.message;console.error(error);});

 function dispose(){
  if(state.disposed)return;state.disposed=true;cancelAnimationFrame(state.raf);
  if(state.level==="mondo"){if(w.scene.fog&&state.fogDensity!=null)w.scene.fog.density=state.fogDensity;w.cam.p.set(STAIR.x,1.8,STAIR.z-3.6);w.cam.target.set(STAIR.x,1.3,STAIR.z);R.state.walk=true;const inspector=get("rai-inspector");if(inspector)inspector.hidden=state.beforeInspector;if(w.fade)w.fade.style.opacity="0";}
  off.forEach(fn=>fn());disposeTiles();root.removeFromParent();ground.removeFromParent();for(const tx of cardCache.values())tx.dispose();cardCache.clear();
  resources.forEach(r=>{try{r.dispose();}catch(_){}});panel.remove();dock.remove();hint.remove();tip.remove();nav.remove();style.remove();
  if(window.RareAtlasMondoFloor?.root===root)window.RareAtlasMondoFloor=null;
 }
 window.RareAtlasMondoFloor={root,ground,state,descend,ascend,toggleOverview,select,walkToTile,walkToGallery,search,adopt,dispose,get layout(){return layout;}};
 state.raf=requestAnimationFrame(tick);
 return "Added the Mondo floor: a stairwell beside the library leads to a lower level where every Mondo rare disease is a tile drawn from its own metadata, grouped by body system, with search, galleries, source filters and an overview. Existing scene, computers and research are preserved.";
})();
  }catch(error){console.error("Atlas extensions:",error);}
 }else requestAnimationFrame(attachComputers);
})();
